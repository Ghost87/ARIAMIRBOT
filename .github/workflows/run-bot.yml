name: 🤖 Run ARIAMIR Orders

# ──────────────────────────────────────────────────────────────
#  روش استفاده: تب Actions → 🤖 Run ARIAMIR Orders → Run workflow
#  ورودی «minutes» = چند دقیقه ربات آنلاین بمونه (۱ تا ۳۵۶)
#  ریپو پابلیک است ⇒ اجرای Actions روی رانر استاندارد رایگان و نامحدوده ✨
# ──────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "⏱ چند دقیقه ربات آنلاین باشه؟ (۱ تا ۳۵۶)"
        required: true
        default: "356"
        type: string
      wipe_db:
        description: "🗑 دیتابیس پاک بشه؟ (برای تست از صفر — پیش‌فرض: نه)"
        required: false
        default: false
        type: boolean
  schedule:
    # 🕒 هر ۶ ساعت خودکار بالا می‌آید — در صف می‌ایستد و درست وقتی قبلی
    #    تمام شد شروع می‌شود (نگهبان: cancel-in-progress خاموش است) → پوشش ۲۴/۷
    - cron: "13 */6 * * *"

# ران بعدی را لغو نکن — بگذار صف بایستد تا قبلی تمام شود و بی‌درز مچ شود
concurrency:
  group: run-ariamir-orders
  cancel-in-progress: false

permissions:
  contents: write  # برای ذخیره دیتابیسِ رمزشده در برنچ db-backup بین اجراها

jobs:
  run:
    name: 🚀 آنلاین کردن ربات (سورس رمزنگاری‌شده)
    runs-on: ubuntu-latest
    timeout-minutes: 360  # سقف هر Job شش ساعته گیت‌هاب
    env:
      DECRYPT_KEY: ${{ secrets.SRC_KEY }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
      ADMIN_GROUP_ID: ${{ secrets.ADMIN_GROUP_ID }}
      GH_PAT: ${{ secrets.GH_PAT }}
      # ─── v3.5: پل وب‌پنل (Contents API روی برنچ db-backup — اسنپ‌شات و فرمان‌ها) ───
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ─── v3.0: هوش مصنوعی (اختیاری — خالی = خاموش امن) ───
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
      AI_ENABLED: ${{ secrets.AI_ENABLED }}
    steps:
      - name: 📥 دانلود کد (src.enc — سورس رمزشده)
        uses: actions/checkout@v5

      - name: 🗄 بازیابی دیتابیس رمزشده از اجرای قبلی
        run: |
          mkdir -p data
          if [ "${{ github.event.inputs.wipe_db }}" = "true" ]; then
            echo "🗑 wipe_db روشن است — دیتابیس قبلی بازیابی نمی‌شود؛ از صفر شروع می‌کنیم"
            rm -f data/bot.db data/bot.db.enc
            exit 0
          fi
          if [ -z "$DECRYPT_KEY" ]; then
            echo "⚠️ DECRYPT_KEY ست نشده — بازیابی دیتابیس ممکن نیست؛ از صفر شروع می‌کنیم"
            exit 0
          fi
          if curl -sfL \
             "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/db-backup/data/bot.db.enc" \
             -o data/bot.db.enc && [ -s data/bot.db.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -md sha256 \
              -in data/bot.db.enc -out data/bot.db -pass env:DECRYPT_KEY \
              && rm -f data/bot.db.enc \
              && echo "✅ دیتابیس اجرای قبلی رمزگشایی و بازیابی شد 🎉" \
              || { echo "⚠️ رمزگشایی دیتابیس ناموفق — DECRYPT_KEY با رمز قبلی فرق دارد؟ از صفر می‌رویم"; rm -f data/bot.db; }
          else
            echo "🆕 دیتابیسی از قبل نیست (اولین اجرا) — دیتابیس تازه ساخته می‌شود"
            rm -f data/bot.db
          fi

      - name: 🐍 نصب پایتون
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: ⏱ اعتبارسنجی زمان
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MIN="345"   # اجرای خودکار نگهبان — هر ۶ ساعت (سقف مؤثر جاب)
          else
            MIN="${{ github.event.inputs.minutes || '356' }}"
          fi
          if ! [[ "$MIN" =~ ^[0-9]+$ ]] || [ "$MIN" -lt 1 ] || [ "$MIN" -gt 356 ]; then
            echo "::error::⏱ زمان باید بین ۱ تا ۳۵۶ دقیقه باشه (سقف هر Job شش ساعته)"
            exit 1
          fi
          echo "MINUTES=$MIN" >> "$GITHUB_ENV"
          echo "✅ ربات برای **$MIN دقیقه** آنلاین می‌شه (${{ github.event_name }})"

      - name: 🖥 نمایش ظرفیت رانر
        run: |
          echo "┌─ 🖥 ظرفیت رانر GitHub ─────────────"
          echo "│ ⚙️  CPU: $(nproc) هسته"
          free -h | awk '/^Mem:/{print "│ 🧠 RAM: " $2 " (آزاد: " $7 ")"}'
          df -h / | awk 'NR==2{print "│ 💾 دیسک: " $2 " (آزاد: " $4 ")"}'
          echo "└─────────────────────────────────"
          {
            echo "### 🖥 ظرفیت رانر GitHub"
            echo "| مورد | مقدار |"
            echo "|---|---|"
            echo "| ⚙️ CPU | $(nproc) هسته |"
            free -h | awk '/^Mem:/{print "| 🧠 RAM | " $2 " |"}'
            df -h / | awk 'NR==2{print "| 💾 دیسک | " $2 " (آزاد: " $4 ") |"}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 💳 وضعیت Actions (ریپو پابلیک = رایگان نامحدود 🎉)
        run: |
          echo "┌─ 💳 هزینه اجرا ─────────────"
          echo "│ ✨ ریپو PUBLIC است — اجرای رانر استاندارد گیت‌هاب کاملاً رایگان و نامحدود است."
          if [ -n "$GH_PAT" ]; then
            TYPE=$(curl -s -H "Authorization: Bearer $GH_PAT" \
              "https://api.github.com/users/${GITHUB_REPOSITORY_OWNER}" | jq -r .type)
            if [ "$TYPE" = "Organization" ]; then
              BURL="https://api.github.com/orgs/${GITHUB_REPOSITORY_OWNER}/settings/billing/actions"
            else
              BURL="https://api.github.com/users/${GITHUB_REPOSITORY_OWNER}/settings/billing/actions"
            fi
            RESP=$(curl -s -H "Authorization: Bearer $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$BURL")
            echo "$RESP" | jq -r '"│ 📊 مالک: \(.name // "—")"' 2>/dev/null || echo "│ ℹ️ بیلینگ خونده نشد (طبیعیه — پابلیک رایگانه)"
          else
            echo "│ ℹ️ سکرت GH_PAT ست نشده — نیازی هم نیست؛ پابلیک رایگانه."
          fi
          echo "│ 🚀 این اجرا: ${{ env.MINUTES }} دقیقه"
          echo "└─────────────────────────────────"

      - name: 📦 نصب وابستگی‌ها
        run: pip install -q --disable-pip-version-check -r requirements.txt

      - name: 🔍 چک سکرت‌ها
        run: |
          OK=1
          if [ -z "$BOT_TOKEN" ]; then
            echo "::error::🔑 سکرت BOT_TOKEN ست نشده!"
            OK=0
          else
            echo "✅ BOT_TOKEN موجوده"
          fi
          if [ -z "$DECRYPT_KEY" ]; then
            echo "::error::🔐 سکرت DECRYPT_KEY ست نشده (رمز فایل‌های رمزنگاری‌شده)!"
            OK=0
          else
            echo "✅ DECRYPT_KEY موجوده"
          fi
          [ "$OK" = "1" ] || { echo "برو: Settings → Secrets and variables → Actions"; exit 1; }

      - name: 🤖 اجرای ربات (رمزگشایی سورس در حافظه موقت)
        run: |
          echo "🟢 ARIAMIR Orders روشن شد — ${MINUTES} دقیقه در خدمته..."
          timeout -s TERM "${MINUTES}m" python -u run_encrypted.py 2>&1 | tee bot_run.log
          echo "🏁 پایان زمان اجرا (timeout) — ربات تمیز خاموش شد"
          exit 0

      - name: 📊 گزارش این اجرا
        if: always()
        run: |
          echo "⏱ این اجرا ${MINUTES:-0} دقیقه آنلاین بود (ریپو پابلیک = رایگان)"
          echo "- ⏱ مصرف این اجرا: **${MINUTES:-0} دقیقه** (پابلیک = رایگان ✨)" >> "$GITHUB_STEP_SUMMARY"

      - name: 💾 ذخیره دیتابیس «رمزشده» در برنچ db-backup
        if: always()
        run: |
          if [ ! -f data/bot.db ]; then echo "⏭ دیتابیسی برای ذخیره نیست"; exit 0; fi
          if [ -z "$DECRYPT_KEY" ]; then echo "⚠️ بدون DECRYPT_KEY ذخیره انجام نمی‌شود"; exit 0; fi
          openssl enc -aes-256-cbc -pbkdf2 -salt -md sha256 \
            -in data/bot.db -out data/bot.db.enc -pass env:DECRYPT_KEY
          TMP=$(mktemp -d)
          mkdir -p "$TMP/data" && mv data/bot.db.enc "$TMP/data/bot.db.enc"
          cd "$TMP"
          git init -q -b db-backup .
          git config user.name "ariamirbot[actions]"
          git config user.email "ariamirbot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q origin db-backup 2>/dev/null && git reset -q --soft origin/db-backup || true
          git add data/bot.db.enc
          if git commit -q -m "💾 بکاپ رمزشده دیتابیس — $(date -u +'%Y-%m-%d %H:%M:%S') UTC"; then
            git push -q origin db-backup && echo "✅ دیتابیس رمزشده برای اجرای بعدی ذخیره شد 🔐"
            echo "- 💾 دیتابیس رمزشده در db-backup ذخیره شد (با همان DECRYPT_KEY باز می‌شود)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ تغییری در دیتابیس نبود"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 ذخیره دیتابیس رمزشده و لاگ (آرتیفکت)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ariamir-orders-data
          path: |
            data/bot.db.enc
            bot_run.log
          if-no-files-found: ignore
          retention-days: 30
