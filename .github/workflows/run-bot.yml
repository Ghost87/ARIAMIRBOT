name: 🤖 Run ARIAMIR Orders

# ──────────────────────────────────────────────────────────────
#  روش استفاده: تب Actions → 🤖 Run ARIAMIR Orders → Run workflow
#  ورودی «minutes» = چند دقیقه ربات آنلاین بمونه (۱ تا ۳۵۶)
#  ریپو پابلیک است ⇒ اجرای Actions روی رانر استاندارد رایگان و نامحدوده ✨
#
#  🔗 v4.2.1 — زنجیرهٔ بی‌وقفه (Self-chaining):
#  هر اجرا وقتی ربات چند دقیقه سالم ماند، «اجرای بعدی» را خودش رزرو می‌کند.
#  اجرای رزروشده در صف concurrency منتظر می‌ماند و همان لحظه‌ای که این اجرا
#  تمام شد بالا می‌آید (~۱ دقیقه وقفه به‌جای چند ساعت). cron و نگهبان فقط
#  پشتیبان‌اند — چون cron گیت‌هاب ساعت‌ها دیر می‌کند یا اصلاً اجرا نمی‌شود.
#
#  ⛔ خاموش‌کردن کامل ربات: Actions → این ورک‌فلو → «…» → Disable workflow
#     (و همین کار برای 🐕 Bot Watchdog) → بعد ران در حال اجرا و ران در صف را Cancel کن.
#  🚀 اعمال فوری نسخهٔ جدید بعد از push: ران در حال اجرا را Cancel کن —
#     ران بعدی (که با push ساخته شده) همان لحظه با کد جدید بالا می‌آید.
# ──────────────────────────────────────────────────────────────
on:
  push:
    # آپدیت کد/لانچر/ورک‌فلو ⇒ یک اجرای تازه با کد جدید در صف می‌ایستد
    # (جای ران رزروشدهٔ قبلی را می‌گیرد و بعد از ران فعلی بالا می‌آید)
    branches: [main]
    paths:
      - "src.enc"
      - "run_encrypted.py"
      - "requirements.txt"
      - ".github/workflows/run-bot.yml"
  workflow_dispatch:
    inputs:
      minutes:
        description: "⏱ چند دقیقه ربات آنلاین باشه؟ (۱ تا ۳۵۶)"
        required: true
        default: "356"
        type: string
      wipe_db:
        description: "🗑 دیتابیس پاک بشه؟ (برای تست از صفر — پیش‌فرض: نه)"
        required: false
        default: false
        type: boolean
  schedule:
    # 🕒 پشتیبان: هر ۶ ساعت — گیت‌هاب این را با تأخیر ۱ تا ۳ ساعت (یا هرگز) اجرا می‌کند،
    #    برای همین موتور اصلی ۲۴/۷ «زنجیرهٔ بی‌وقفه» داخل مرحلهٔ اجرای ربات است.
    - cron: "13 */6 * * *"

# ران بعدی را لغو نکن — بگذار صف بایستد تا قبلی تمام شود و بی‌درز مچ شود
concurrency:
  group: run-ariamir-orders
  cancel-in-progress: false

permissions:
  contents: write  # برای ذخیره دیتابیسِ رمزشده در برنچ db-backup بین اجراها
  actions: write   # 🔗 برای رزرو اجرای بعدی (workflow_dispatch) — زنجیرهٔ بی‌وقفه

jobs:
  run:
    name: 🚀 آنلاین کردن ربات (سورس رمزنگاری‌شده)
    runs-on: ubuntu-latest
    timeout-minutes: 360  # سقف هر Job شش ساعته گیت‌هاب
    env:
      DECRYPT_KEY: ${{ secrets.SRC_KEY }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
      ADMIN_GROUP_ID: ${{ secrets.ADMIN_GROUP_ID }}
      GH_PAT: ${{ secrets.GH_PAT }}
      # ─── v3.5: پل وب‌پنل (Contents API روی برنچ db-backup — اسنپ‌شات و فرمان‌ها) ───
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ─── v3.0: هوش مصنوعی (اختیاری — خالی = خاموش امن) ───
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
      AI_ENABLED: ${{ secrets.AI_ENABLED }}
    steps:
      - name: 📥 دانلود کد (src.enc — سورس رمزشده)
        uses: actions/checkout@v5

      - name: 🗄 بازیابی دیتابیس رمزشده از اجرای قبلی
        run: |
          mkdir -p data
          if [ "${{ github.event.inputs.wipe_db }}" = "true" ]; then
            echo "🗑 wipe_db روشن است — دیتابیس قبلی بازیابی نمی‌شود؛ از صفر شروع می‌کنیم"
            rm -f data/bot.db data/bot.db.enc
            exit 0
          fi
          if [ -z "$DECRYPT_KEY" ]; then
            echo "⚠️ سکرت SRC_KEY ست نشده — بازیابی دیتابیس ممکن نیست؛ از صفر شروع می‌کنیم"
            exit 0
          fi
          # ۱) مستقیم از git (بدون کش CDN) — اجرای بعدی چند ثانیه بعد از ذخیرهٔ
          #    اجرای قبلی شروع می‌شود؛ raw.githubusercontent تا ۵ دقیقه نسخهٔ کهنه می‌دهد.
          # ۲) اگر نشد: همان روش قبلی (raw) به‌عنوان پشتیبان.
          GOT=""
          if git fetch -q --depth=1 origin db-backup 2>/dev/null \
             && git show FETCH_HEAD:data/bot.db.enc > data/bot.db.enc 2>/dev/null \
             && [ -s data/bot.db.enc ]; then
            GOT="git ($(git rev-parse --short FETCH_HEAD))"
          elif curl -sfL \
             "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/db-backup/data/bot.db.enc" \
             -o data/bot.db.enc && [ -s data/bot.db.enc ]; then
            GOT="raw"
          fi
          if [ -n "$GOT" ]; then
            echo "📥 دیتابیس رمزشده دریافت شد از: $GOT"
            openssl enc -d -aes-256-cbc -pbkdf2 -md sha256 \
              -in data/bot.db.enc -out data/bot.db -pass env:DECRYPT_KEY \
              && rm -f data/bot.db.enc \
              && echo "✅ دیتابیس اجرای قبلی رمزگشایی و بازیابی شد 🎉" \
              || { echo "⚠️ رمزگشایی دیتابیس ناموفق — مقدار SRC_KEY درست نیست؟ از صفر می‌رویم"; rm -f data/bot.db; }
          else
            echo "🆕 دیتابیسی از قبل نیست (اولین اجرا) — دیتابیس تازه ساخته می‌شود"
            rm -f data/bot.db
          fi

      - name: 🐍 نصب پایتون
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: ⏱ اعتبارسنجی زمان
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MIN="345"   # اجرای خودکار نگهبان — هر ۶ ساعت (سقف مؤثر جاب)
          else
            MIN="${{ github.event.inputs.minutes || '356' }}"
          fi
          if ! [[ "$MIN" =~ ^[0-9]+$ ]] || [ "$MIN" -lt 1 ] || [ "$MIN" -gt 356 ]; then
            echo "::error::⏱ زمان باید بین ۱ تا ۳۵۶ دقیقه باشه (سقف هر Job شش ساعته)"
            exit 1
          fi
          echo "MINUTES=$MIN" >> "$GITHUB_ENV"
          echo "✅ ربات برای **$MIN دقیقه** آنلاین می‌شه (${{ github.event_name }})"

      - name: 🖥 نمایش ظرفیت رانر
        run: |
          echo "┌─ 🖥 ظرفیت رانر GitHub ─────────────"
          echo "│ ⚙️  CPU: $(nproc) هسته"
          free -h | awk '/^Mem:/{print "│ 🧠 RAM: " $2 " (آزاد: " $7 ")"}'
          df -h / | awk 'NR==2{print "│ 💾 دیسک: " $2 " (آزاد: " $4 ")"}'
          echo "└─────────────────────────────────"
          {
            echo "### 🖥 ظرفیت رانر GitHub"
            echo "| مورد | مقدار |"
            echo "|---|---|"
            echo "| ⚙️ CPU | $(nproc) هسته |"
            free -h | awk '/^Mem:/{print "| 🧠 RAM | " $2 " |"}'
            df -h / | awk 'NR==2{print "| 💾 دیسک | " $2 " (آزاد: " $4 ") |"}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 💳 وضعیت Actions (ریپو پابلیک = رایگان نامحدود 🎉)
        run: |
          echo "┌─ 💳 هزینه اجرا ─────────────"
          echo "│ ✨ ریپو PUBLIC است — اجرای رانر استاندارد گیت‌هاب کاملاً رایگان و نامحدود است."
          if [ -n "$GH_PAT" ]; then
            TYPE=$(curl -s -H "Authorization: Bearer $GH_PAT" \
              "https://api.github.com/users/${GITHUB_REPOSITORY_OWNER}" | jq -r .type)
            if [ "$TYPE" = "Organization" ]; then
              BURL="https://api.github.com/orgs/${GITHUB_REPOSITORY_OWNER}/settings/billing/actions"
            else
              BURL="https://api.github.com/users/${GITHUB_REPOSITORY_OWNER}/settings/billing/actions"
            fi
            RESP=$(curl -s -H "Authorization: Bearer $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$BURL")
            echo "$RESP" | jq -r '"│ 📊 مالک: \(.name // "—")"' 2>/dev/null || echo "│ ℹ️ بیلینگ خونده نشد (طبیعیه — پابلیک رایگانه)"
          else
            echo "│ ℹ️ سکرت GH_PAT ست نشده — نیازی هم نیست؛ پابلیک رایگانه."
          fi
          echo "│ 🚀 این اجرا: ${{ env.MINUTES }} دقیقه"
          echo "└─────────────────────────────────"

      - name: 📦 نصب وابستگی‌ها
        run: pip install -q --disable-pip-version-check -r requirements.txt

      - name: 🔍 چک سکرت‌ها
        run: |
          OK=1
          if [ -z "$BOT_TOKEN" ]; then
            echo "::error::🔑 سکرت BOT_TOKEN ست نشده!"
            OK=0
          else
            echo "✅ BOT_TOKEN موجوده"
          fi
          if [ -z "$DECRYPT_KEY" ]; then
            echo "::error::🔐 سکرت SRC_KEY ست نشده (رمز فایل‌های رمزنگاری‌شده)!"
            OK=0
          else
            echo "✅ SRC_KEY موجوده"
          fi
          [ "$OK" = "1" ] || { echo "برو: Settings → Secrets and variables → Actions"; exit 1; }

      - name: 🤖 اجرای ربات (رمزگشایی سورس در حافظه موقت)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🟢 ARIAMIR Orders روشن شد — ${MINUTES} دقیقه در خدمته..."

          # 🔗 زنجیرهٔ بی‌وقفه: اگر ربات بعد از HANDOFF ثانیه هنوز زنده بود، اجرای
          #    بعدی را همین حالا رزرو کن. ران رزروشده در صف concurrency می‌ماند و
          #    دقیقاً وقتی این ران تمام شد شروع می‌شود → دیگر منتظر cron نیستیم.
          #    ضد حلقه: اگر ربات زود کرش کند، رزروی انجام نمی‌شود.
          HANDOFF=$(( MINUTES * 60 / 2 ))
          if [ "$HANDOFF" -gt 600 ]; then HANDOFF=600; fi
          (
            sleep "$HANDOFF"
            if pgrep -f "run_encrypted.py" >/dev/null; then
              if curl -sf -X POST \
                   -H "Authorization: Bearer ${GH_TOKEN}" \
                   -H "Accept: application/vnd.github+json" \
                   "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/run-bot.yml/dispatches" \
                   -d '{"ref":"main","inputs":{"minutes":"356","wipe_db":"false"}}'; then
                echo "$(date -u +%H:%M:%S) UTC ✅ اجرای بعدی رزرو شد — بعد از این ران بی‌وقفه بالا می‌آید"
              else
                echo "$(date -u +%H:%M:%S) UTC ⚠️ رزرو اجرای بعدی ناموفق — cron و نگهبان پشتیبان‌اند"
              fi
            else
              echo "$(date -u +%H:%M:%S) UTC ⛔ ربات زنده نماند — اجرای بعدی رزرو نشد (ضد حلقه)"
            fi
          ) </dev/null >handoff.log 2>&1 &
          HANDOFF_PID=$!

          # ⚠️ گیت‌هاب اسکریپت را با bash -e اجرا می‌کند؛ بدون set +e، کد 124 (پایان
          #    عادی timeout) همین‌جا اسکریپت را می‌کشت و «هر» ران قرمز (failure) می‌شد.
          set +e
          set -o pipefail
          timeout -k 60s -s TERM "${MINUTES}m" python -u run_encrypted.py 2>&1 | tee bot_run.log
          CODE=${PIPESTATUS[0]}
          set -e
          kill "$HANDOFF_PID" 2>/dev/null || true

          echo "──── 🔗 زنجیرهٔ بی‌وقفه ────"
          cat handoff.log 2>/dev/null || true
          [ -s handoff.log ] || echo "ℹ️ رزرو اجرای بعدی انجام نشد (ران کوتاه‌تر از زمان رزرو بود)"
          { echo "### 🔗 زنجیرهٔ بی‌وقفه"; echo '```'; cat handoff.log 2>/dev/null || echo "—"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

          # 0 = خودش تمام شد · 124 = پایان زمان (عادی) · 137 = KILL بعد از مهلت · 143 = TERM
          case "$CODE" in
            0|124|137|143)
              echo "🏁 پایان زمان اجرا — ربات تمیز خاموش شد (کد $CODE)" ;;
            *)
              echo "::error::💥 ربات زودتر از موعد متوقف شد (کد خروج $CODE) — انتهای لاگ:"
              tail -n 25 bot_run.log || true
              { echo "### 💥 توقف زودهنگام ربات (کد $CODE)"; echo '```'; tail -n 25 bot_run.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              exit "$CODE" ;;
          esac

      - name: 📊 گزارش این اجرا
        if: always()
        run: |
          echo "⏱ این اجرا ${MINUTES:-0} دقیقه آنلاین بود (ریپو پابلیک = رایگان)"
          echo "- ⏱ مصرف این اجرا: **${MINUTES:-0} دقیقه** (پابلیک = رایگان ✨)" >> "$GITHUB_STEP_SUMMARY"

      - name: 💾 ذخیره دیتابیس «رمزشده» در برنچ db-backup
        if: always()
        run: |
          if [ ! -f data/bot.db ]; then echo "⏭ دیتابیسی برای ذخیره نیست"; exit 0; fi
          if [ -z "$DECRYPT_KEY" ]; then echo "⚠️ بدون SRC_KEY ذخیره انجام نمی‌شود"; exit 0; fi
          openssl enc -aes-256-cbc -pbkdf2 -salt -md sha256 \
            -in data/bot.db -out data/bot.db.enc -pass env:DECRYPT_KEY
          TMP=$(mktemp -d)
          mkdir -p "$TMP/data" && mv data/bot.db.enc "$TMP/data/bot.db.enc"
          cd "$TMP"
          git init -q -b db-backup .
          git config user.name "ariamirbot[actions]"
          git config user.email "ariamirbot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # v4.2.1:
          #  • --depth=1 → فقط آخرین کامیت (برنچ ده‌ها هزار کامیت اسنپ‌شات دارد)
          #  • reset «mixed» به‌جای --soft → ایندکس = درخت فعلی برنچ؛ قبلاً ایندکس خالی
          #    می‌ماند و هر بکاپ، panel/snapshot.json.enc (و فرمان‌های پنل) را «پاک» می‌کرد
          #  • اگر push رد شد (مثلاً پنل همزمان فرمان نوشت) → دوباره fetch و تلاش
          SAVED=0
          for TRY in 1 2 3; do
            if git fetch -q --depth=1 origin db-backup 2>/dev/null; then
              git reset -q origin/db-backup
            fi
            git add data/bot.db.enc
            git commit -q -m "💾 بکاپ رمزشده دیتابیس — $(date -u +'%Y-%m-%d %H:%M:%S') UTC" || true
            if git push -q origin HEAD:db-backup 2>/dev/null; then SAVED=1; break; fi
            echo "⏳ تلاش $TRY برای ذخیره ناموفق — دوباره..."
            git reset -q --soft HEAD~1 2>/dev/null || true
            sleep $((TRY * 3))
          done
          if [ "$SAVED" = "1" ]; then
            echo "✅ دیتابیس رمزشده برای اجرای بعدی ذخیره شد 🔐"
            echo "- 💾 دیتابیس رمزشده در db-backup ذخیره شد (با همان SRC_KEY باز می‌شود)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::💾 ذخیرهٔ دیتابیس در db-backup ناموفق ماند — نسخهٔ رمزشده در آرتیفکت همین ران هست"
            cp data/bot.db.enc "$GITHUB_WORKSPACE/data/bot.db.enc" 2>/dev/null || true
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 ذخیره دیتابیس رمزشده و لاگ (آرتیفکت)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ariamir-orders-data
          path: |
            data/bot.db.enc
            bot_run.log
          if-no-files-found: ignore
          retention-days: 30
